<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaib WhatsApp Spot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      color: #4CAF50;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 80%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ddd;
      border-radius: 5px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 85%;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Zaib WhatsApp Spot</h1>
    <p>Enter your WhatsApp number below to get help from WhatsApp support for unbanning your account.</p>
    <input type="text" id="phone_number" placeholder="Enter your phone number">
    <br><br>
    <button onclick="sendToWhatsApp()">Help</button>
    <div class="footer">
      <p>By using this service, you agree to our <a href="#">Terms & Conditions</a>.</p>
    </div>
  </div>

  <script>
    function sendToWhatsApp() {
      const phoneNumber = document.getElementById('phone_number').value;
      const message = `Hello WhatsApp Support, I need help unbanning my WhatsApp account. My phone number is: ${phoneNumber}.`;
      if (phoneNumber) {
        const url = `https://wa.me/1234567890?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
      } else {
        alert("Please enter a valid phone number.");
      }
    }
  </script>

</body>
</html>
